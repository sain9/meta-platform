services:

  gateway-api:
    build:
      context: .
      dockerfile: gateway-api/Dockerfile
    container_name: gateway-api
    ports:
      - "9999:9999"
    depends_on:
      - data-api
      - definition-api
      - user-access-api
    networks:
      - meta-platform-net

  data-api:
    build:
      context: .
      dockerfile: data-api/Dockerfile
    container_name: data-api
    ports:
      - "9995:9995"     # REST
      - "9003:9003"     # gRPC — NEW
    networks:
      - meta-platform-net

  definition-api:
    build:
      context: .
      dockerfile: definition-api/Dockerfile
    container_name: definition-api
    ports:
      - "9996:9996"
    networks:
      - meta-platform-net

  user-access-api:
    build:
      context: .
      dockerfile: user-access-api/Dockerfile
    container_name: user-access-api
    ports:
      - "9997:9997"
    networks:
      - meta-platform-net

networks:
  meta-platform-net:
    external: true
    name: meta-platform-net
