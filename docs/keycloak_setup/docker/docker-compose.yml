version: "3.9"

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    container_name: keycloak
    restart: always

    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123

    command: start-dev

    ports:
      - "9001:8080"

    networks:
      - meta-platform-net

networks:
  meta-platform-net:
    external: true
    name: meta-platform-net