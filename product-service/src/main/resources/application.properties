# Server port for the POC microservice
server.port=8085

spring.application.name=product-service

# Data API Client Configuration
# Assuming data-api is running in Docker, it should use the container name or hostname.
# The user's docker ps shows data-api is available on localhost:9003 for grpc.
# Since product-service will run as a local process for now, localhost is correct.
data-api.grpc.host=localhost
data-api.grpc.port=9003
data-api.grpc.deadline-seconds=30
