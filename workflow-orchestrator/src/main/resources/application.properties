# Application Name
spring.application.name=workflow-orchestrator

# Server Configuration
server.port=9998
server.compression.enabled=true
server.compression.min-response-size=1024

# data-api-client gRPC configuration (auto-configured by data-api-client jar)
data-api.grpc.host=localhost
data-api.grpc.port=9003
data-api.grpc.plaintext=true
data-api.grpc.deadline-seconds=30

# Disable datasource auto-configuration (data-api-client handles all DB via gRPC)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Logging
logging.level.com.hussain.workflow_orchestrator=DEBUG
logging.level.io.grpc=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Management/Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Workflow store (mirrors Spriced reference implementation)
workflow.store.enabled=true
workflow.store.poll-interval-ms=60000

# Orchestrator runtime
workflow.orchestrator.execution.timeout=300000
workflow.orchestrator.max-concurrent-workflows=10
workflow.orchestrator.queue-capacity=100